# Local development and CI environment. Credentials are for local use only (bound to 127.0.0.1).
name: obx-dev
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress-dev
      MARIADB_ROOT_PASSWORD: root-dev
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${OBX_PORT:-8088}:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress-dev
      WORDPRESS_DEBUG: "1"
    volumes: &wp_volumes
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/oldbear-elementor-expansion:ro
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment: *wp_env
    volumes: *wp_volumes
volumes:
  db:
  wp:
